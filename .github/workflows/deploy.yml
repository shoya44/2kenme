name: Deploy

on:
  push:
    branches: [main]
  # 手動でも実行できるようにする（GitHubのWeb UIから押せる）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Secretsが未設定のうちは失敗させずスキップする。
      # 設定前からmainが赤くなるのを避けるため
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### デプロイをスキップしました"
              echo
              echo "リポジトリの Settings → Secrets and variables → Actions に"
              echo "\`CLOUDFLARE_API_TOKEN\` と \`CLOUDFLARE_ACCOUNT_ID\` を登録すると動きます。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - if: steps.check.outputs.ready == 'true'
        run: npm ci

      - if: steps.check.outputs.ready == 'true'
        run: npm run build

      # HOTPEPPER_API_KEY は GitHub Secrets から Worker の Secret へ反映する。
      # ターミナルでの wrangler secret put が不要になる
      - if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            HOTPEPPER_API_KEY
        env:
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
