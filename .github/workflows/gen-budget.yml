name: 予算マスタを生成

# HotPepperの検索用ディナー予算マスタから worker/budget-master.generated.ts を作り直す。
# ターミナルが無くても GitHub の Web UI から実行できるようにしてある。
#
#   Actions タブ → 「予算マスタを生成」 → Run workflow
#
# 事前に Secrets へ HOTPEPPER_API_KEY を登録しておくこと。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-budget
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - id: check
        env:
          KEY: ${{ secrets.HOTPEPPER_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            {
              echo "### HOTPEPPER_API_KEY が未登録です"
              echo
              echo "Settings → Secrets and variables → Actions に登録してから再実行してください。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: マスタを取得して生成する
        env:
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
        run: npm run gen:budget

      # 生成物が壊れていないことを確かめてからコミットする
      - run: npm run typecheck
      - run: npm run test:worker

      - name: 差分があればコミットする
        run: |
          if git diff --quiet -- worker/budget-master.generated.ts; then
            echo "### 変更はありませんでした" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/budget-master.generated.ts
          git commit \
            -m 'chore: 予算マスタを実データで再生成する' \
            -m 'HotPepper 検索用ディナー予算マスタAPIから生成した。暫定データを実データへ差し替える。'
          git push

          {
            echo "### 予算マスタを更新しました"
            echo
            echo '```'
            git show --stat --oneline HEAD | head -5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
